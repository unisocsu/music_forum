name: Legacy browser compatibility

on:
  push:
    branches: [main]
    paths:
      - '.github/compat/**'
      - '.github/workflows/legacy-browser-compat.yml'
      - 'webpack.common.js'
      - 'webpack.prod.js'
      - '.browserslistrc'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-kitkat-emulator:
    name: Android 4.4 KitKat browser smoke test (API 19)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Start Android 4.4 emulator and test browser
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 19
          target: default
          arch: x86
          profile: Nexus 5
          emulator-options: -no-window -no-audio -no-boot-anim -camera-back none
          disable-animations: true
          script: sh .github/scripts/kitkat-smoke.sh
